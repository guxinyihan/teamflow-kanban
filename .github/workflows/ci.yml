name: TeamFlow verification

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - name: Backend lint
        run: python -m ruff check backend
      - name: SQLite API, authorization, concurrency, attachments, WebSocket and migration tests
        run: python -m pytest -q
      - name: Fresh Alembic migration through the documented CLI
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teamflow
          # Disposable CI database credentials, never production credentials.
          POSTGRES_PASSWORD: teamflow-ci-only
          POSTGRES_DB: teamflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow -d teamflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teamflow:teamflow-ci-only@127.0.0.1:5432/teamflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - name: Real PostgreSQL integration and migration suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
